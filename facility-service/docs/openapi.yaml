openapi: 3.0.3
info:
  title: Facility Service API
  version: 1.0.0
  description: |
    University Facility Booking System — Facility Service (facility_db)
    ทุก endpoint ต้องส่ง `Authorization: Bearer <Keycloak access token>`
servers:
  - url: http://localhost:8000
    description: ผ่าน Kong Gateway
  - url: http://localhost:8082
    description: เรียก service ตรง
security:
  - bearerAuth: []
tags:
  - name: Facilities
  - name: Reports

paths:
  /api/facilities:
    post:
      tags: [Facilities]
      summary: "1. Create — เพิ่มห้อง/พื้นที่ (STAFF, ADMIN)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFacilityRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Facility' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Facilities]
      summary: "2. List/Search — ดู/ค้นหาห้อง (ทุก role)"
      parameters:
        - { name: q, in: query, schema: { type: string }, description: ค้นหาจากชื่อหรือรายละเอียด }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/FacilityType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FacilityStatus' } }
        - { name: min_capacity, in: query, schema: { type: integer, minimum: 0 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Facility' } }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
                  total_pages: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/facilities/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Facilities]
      summary: "3. Read one — ดูรายละเอียดห้อง + ช่วงเวลาที่เปิดจองที่ยังไม่ผ่าน (ทุก role)"
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FacilityDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Facilities]
      summary: "4. Update — แก้ไขข้อมูลห้อง ส่งเฉพาะ field ที่ต้องการแก้ (STAFF, ADMIN)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFacilityRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Facility' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Facilities]
      summary: "5. Delete — ลบห้อง (ADMIN)"
      description: ถ้ายังมีช่วงเวลาเปิดจองวันนี้หรือในอนาคต จะได้ 409 เว้นแต่ส่ง `force=true` เพื่อลบช่วงเวลาทั้งหมดไปด้วย
      parameters:
        - { name: force, in: query, schema: { type: boolean, default: false } }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/facilities/{id}/availability:
    post:
      tags: [Facilities]
      summary: "6. Special — กำหนดวันเวลาที่เปิดให้จอง (STAFF, ADMIN)"
      description: |
        กฎ: ห้องต้องมีสถานะ AVAILABLE, วันที่ต้องไม่อยู่ในอดีต, ถ้าเป็นวันนี้เวลาเริ่มต้องยังไม่ผ่าน,
        start_time < end_time และต้องไม่ทับกับช่วงเวลาเดิมของห้องเดียวกันในวันเดียวกัน (ช่วงที่ต่อกันพอดีทำได้)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAvailabilityRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/reports/facilities/usage:
    get:
      tags: [Reports]
      summary: "7. Report — สถิติการใช้ห้อง (ADMIN)"
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: ค่าเริ่มต้น = วันแรกของเดือนนี้ }
        - { name: to, in: query, schema: { type: string, format: date }, description: ค่าเริ่มต้น = วันสุดท้ายของเดือนนี้ }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UsageReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    BadRequest: { description: ข้อมูลไม่ถูกต้อง, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: ไม่มีหรือ token ไม่ถูกต้อง, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: role ไม่มีสิทธิ์, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: ไม่พบข้อมูล, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: ขัดแย้งกับข้อมูลเดิม, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    FacilityType: { type: string, enum: [MEETING_ROOM, HALL, LAB, CLASSROOM, SPORTS, OTHER] }
    FacilityStatus: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
    Error:
      type: object
      properties:
        error: { type: string, example: CONFLICT }
        message: { type: string }
    CreateFacilityRequest:
      type: object
      required: [name, type, capacity]
      properties:
        name: { type: string, maxLength: 100, example: ห้องประชุม 301 }
        type: { $ref: '#/components/schemas/FacilityType' }
        capacity: { type: integer, minimum: 1, example: 30 }
        description: { type: string, example: มีโปรเจกเตอร์และไวท์บอร์ด }
        status: { $ref: '#/components/schemas/FacilityStatus' }
    UpdateFacilityRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        type: { $ref: '#/components/schemas/FacilityType' }
        capacity: { type: integer, minimum: 1 }
        description: { type: string }
        status: { $ref: '#/components/schemas/FacilityStatus' }
    Facility:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/FacilityType' }
        capacity: { type: integer }
        description: { type: string }
        status: { $ref: '#/components/schemas/FacilityStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FacilityDetail:
      allOf:
        - $ref: '#/components/schemas/Facility'
        - type: object
          properties:
            upcoming_availability: { type: array, items: { $ref: '#/components/schemas/Availability' } }
    CreateAvailabilityRequest:
      type: object
      required: [date, start_time, end_time]
      properties:
        date: { type: string, format: date, example: '2026-10-05' }
        start_time: { type: string, pattern: '^\d{2}:\d{2}$', example: '09:00' }
        end_time: { type: string, pattern: '^\d{2}:\d{2}$', example: '12:00' }
    Availability:
      type: object
      properties:
        id: { type: integer, format: int64 }
        facility_id: { type: integer, format: int64 }
        date: { type: string, format: date }
        start_time: { type: string, example: '09:00' }
        end_time: { type: string, example: '12:00' }
        created_at: { type: string, format: date-time }
    UsageReport:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        total_facilities: { type: integer }
        total_capacity: { type: integer }
        total_slots: { type: integer }
        total_available_hours: { type: number }
        by_type: { type: object, additionalProperties: { type: integer }, example: { MEETING_ROOM: 5, LAB: 2 } }
        by_status: { type: object, additionalProperties: { type: integer }, example: { AVAILABLE: 6, UNAVAILABLE: 1 } }
        facilities:
          type: array
          items:
            type: object
            properties:
              facility_id: { type: integer }
              name: { type: string }
              type: { type: string }
              capacity: { type: integer }
              status: { type: string }
              slot_count: { type: integer }
              available_hours: { type: number }
