_format_version: "3.0"

# ไฟล์ route กลางของ Kong (DB-less) — แต่ละคนเพิ่ม service ของตัวเองต่อท้ายใน services:
# frontend เรียกทุกอย่างผ่าน http://localhost:8000 ทางเดียว

services:
  # ---------- คนที่ 1: Auth & User Service (นางสาวณธิดา กาฬหว้า) ----------
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-service-routes
        paths:
          - /api/auth
          - /api/users
          - /api/reports/users
        strip_path: false

  # ---------- คนที่ 2 Auth & User Service (นายประพุทธ์ คำคาวี) ----------
  - name: facility-service
    url: http://facility-service:8082
    routes:
      - name: facility-routes
        paths:
          - /api/facilities
          - /api/reports/facilities
        strip_path: false